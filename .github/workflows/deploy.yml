# Every push to main builds the site and copies it to the Oracle server (hussainjuned.com),
# where Caddy serves ~/sites/portfolio. The deploy key can only write into that folder
# (rrsync on the server), so it can't run commands or touch anything else.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # The server's own key, so the upload can't be sent to an impostor.
          echo "51.170.61.212 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIObNnhGd/ZPZ6SsAu3n16S2LV5YZl6HqFq1nAkHr7jMF" > ~/.ssh/known_hosts
          rsync -rltz --delete -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" dist/ ubuntu@51.170.61.212:./
